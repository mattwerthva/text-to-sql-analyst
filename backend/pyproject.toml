[project]
name = "backend"
version = "0.1.0"
description = "NL analytics assistant over the property-maintenance Postgres sandbox"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.5.0",
    "anthropic>=0.40.0",
    "psycopg[binary]>=3.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
# Put the backend root on sys.path so `import app...` works from tests.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
